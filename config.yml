# =============================================================================
# Rasa Eco-Travel Advisor - NLU pipeline and dialogue policies
# Primary pipeline: spaCy tokeniser + featurisers + DIETClassifier (CPU friendly)
# =============================================================================
recipe: default.v1
assistant_id: eco-travel-advisor
language: en

pipeline:
  # spaCy language model provides tokens and dense word vectors
  - name: SpacyNLP
    model: en_core_web_md
  - name: SpacyTokenizer
  - name: SpacyFeaturizer          # dense sentence/word vectors from spaCy
  - name: RegexFeaturizer          # uses regexes + lookup tables in nlu.yml
  - name: LexicalSyntacticFeaturizer
  - name: CountVectorsFeaturizer   # word-level bag of words
  - name: CountVectorsFeaturizer   # char n-grams make the model robust to typos
    analyzer: char_wb
    min_ngram: 1
    max_ngram: 4
  - name: DIETClassifier           # joint intent classification + entity extraction
    epochs: 200                    # v3: raised from 100 after v2 showed under-confident predictions
    constrain_similarities: true
    tensorboard_log_directory: ./tensorboard   # training curves for the report
    tensorboard_log_level: epoch
  - name: EntitySynonymMapper      # "train" -> "rail", etc.
  - name: ResponseSelector
    epochs: 100
  - name: FallbackClassifier       # stage 0 of error recovery
    threshold: 0.6                 # below this confidence -> nlu_fallback
    ambiguity_threshold: 0.1       # top-2 intents too close -> nlu_fallback

policies:
  - name: MemoizationPolicy
  - name: RulePolicy
    core_fallback_threshold: 0.3
    core_fallback_action_name: action_default_fallback
    enable_fallback_prediction: true
  - name: TEDPolicy
    max_history: 5
    epochs: 100
    constrain_similarities: true
