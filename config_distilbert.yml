# Optional pipeline: DistilBERT features via HuggingFace.
# In Rasa 3.x the old HFTransformersNLP component is merged into LanguageModelFeaturizer.
# Use ONLY if measured inference latency stays well below 3 s (see scripts/measure_latency.py).
recipe: default.v1
assistant_id: eco-travel-advisor
language: en
pipeline:
  - name: WhitespaceTokenizer
  - name: LanguageModelFeaturizer
    model_name: "distilbert"
    model_weights: "distilbert-base-uncased"
  - name: RegexFeaturizer
  - name: CountVectorsFeaturizer
  - name: DIETClassifier
    epochs: 60
    constrain_similarities: true
  - name: EntitySynonymMapper
  - name: FallbackClassifier
    threshold: 0.6
    ambiguity_threshold: 0.1
policies:
  - name: MemoizationPolicy
  - name: RulePolicy
    core_fallback_threshold: 0.3
    core_fallback_action_name: action_default_fallback
  - name: TEDPolicy
    max_history: 5
    epochs: 100
