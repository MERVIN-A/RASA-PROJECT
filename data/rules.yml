version: "3.1"
# =============================================================================
# Rules: deterministic behaviour that must always happen the same way
# =============================================================================
rules:
- rule: Greet
  steps:
  - intent: greet
  - action: utter_greet

- rule: Goodbye
  steps:
  - intent: goodbye
  - action: utter_goodbye

- rule: Thanks
  steps:
  - intent: thank
  - action: utter_youarewelcome

- rule: Bot challenge
  steps:
  - intent: bot_challenge
  - action: utter_iamabot

- rule: Out of scope
  steps:
  - intent: out_of_scope
  - action: utter_out_of_scope

- rule: Privacy question
  steps:
  - intent: ask_privacy
  - action: utter_privacy

- rule: Explain metric (tooltip)
  steps:
  - intent: explain_metric
  - action: utter_explain_metric

- rule: Delete data (GDPR right to erasure)
  steps:
  - intent: delete_data
  - action: action_delete_data

- rule: Show offsets
  steps:
  - intent: ask_offset
  - action: action_show_offsets

- rule: Show hotels
  steps:
  - intent: find_hotels
  - action: action_show_hotels

- rule: Share location outside form
  condition:
  - active_loop: null
  steps:
  - intent: share_location
  - action: action_detect_location

# ---- Trip intake form ------------------------------------------------------
- rule: Activate trip form from plan_trip
  steps:
  - intent: plan_trip
  - action: trip_form
  - active_loop: trip_form

- rule: Activate trip form from compare_transport
  steps:
  - intent: compare_transport
  - action: trip_form
  - active_loop: trip_form

- rule: Activate trip form from ask_carbon
  steps:
  - intent: ask_carbon
  - action: trip_form
  - active_loop: trip_form

- rule: Submit trip form -> search, calculate, rank
  condition:
  - active_loop: trip_form
  steps:
  - action: trip_form
  - active_loop: null
  - slot_was_set:
    - requested_slot: null
  - action: utter_trip_summary
  - action: action_search_travel
  - action: action_calculate_carbon
  - action: action_rank_options
  - action: utter_anything_else

# ---- Interruptions inside the form ----------------------------------------
- rule: Privacy question during form
  condition:
  - active_loop: trip_form
  steps:
  - intent: ask_privacy
  - action: utter_privacy
  - action: trip_form
  - active_loop: trip_form

- rule: Explain metric during form
  condition:
  - active_loop: trip_form
  steps:
  - intent: explain_metric
  - action: utter_explain_metric
  - action: trip_form
  - active_loop: trip_form

- rule: Share GPS location during form
  condition:
  - active_loop: trip_form
  steps:
  - intent: share_location
  - action: action_detect_location
  - action: trip_form
  - active_loop: trip_form

# ---- Error recovery: two-stage clarification then handover ----------------
- rule: NLU fallback -> two-stage clarification
  steps:
  - intent: nlu_fallback
  - action: action_default_fallback

# ---- Human handover ----------------------------------------------------------
- rule: Ask consent before handover
  condition:
  - active_loop: null
  steps:
  - intent: request_human
  - action: utter_ask_handover_consent

- rule: Leave form to ask for a human
  condition:
  - active_loop: trip_form
  steps:
  - intent: request_human
  - action: action_deactivate_loop
  - active_loop: null
  - action: utter_ask_handover_consent

- rule: Consent given -> handover
  steps:
  - action: utter_ask_handover_consent
  - intent: affirm
  - action: action_handover

- rule: Consent declined
  steps:
  - action: utter_ask_handover_consent
  - intent: deny
  - action: utter_handover_declined
