<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Eco-Travel Advisor</title>
<!--
  Eco-Travel Advisor frontend - ReactJS (UMD, no build step) talking to the Rasa REST channel.
  * Quick-reply buttons are rendered from the `buttons` field returned by custom actions/responses.
  * Results cards are colour-coded from the `band` field computed from the Climatiq carbon score.
  * A banner signals human handover when the bot sends {"type":"handover"}.
  Accessibility: aria-live message log, labelled controls, colour always paired with text + icon.
  Configure the Rasa URL with ?rasa=https://your-host or window.RASA_URL (default same host :5005).
-->
<script src="vendor/react.production.min.js"></script>
<script src="vendor/react-dom.production.min.js"></script>
<script src="vendor/htm.umd.js"></script>
<style>
  :root { --green:#1e7a46; --green-bg:#e6f4ec; --amber:#a35c00; --amber-bg:#fff3df; --red:#b3261e; --red-bg:#fdeaea;
          --ink:#1c2b24; --muted:#5b6b63; --bg:#f4f7f5; --card:#ffffff; --brand:#1f6e43; }
  * { box-sizing:border-box; }
  body { margin:0; font-family: "Segoe UI", Roboto, Arial, sans-serif; background:var(--bg); color:var(--ink); }
  .app { max-width:460px; margin:0 auto; height:100vh; display:flex; flex-direction:column; background:#fff; box-shadow:0 0 24px rgba(0,0,0,.08); }
  header { background:var(--brand); color:#fff; padding:14px 16px; display:flex; align-items:center; gap:10px; }
  header h1 { font-size:17px; margin:0; } header small { opacity:.85; display:block; font-size:12px; }
  .handover { background:#283593; color:#fff; padding:9px 14px; font-size:13px; display:flex; gap:8px; align-items:center; }
  .log { flex:1; overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:8px; }
  .msg { max-width:85%; padding:9px 12px; border-radius:14px; font-size:14px; line-height:1.4; white-space:pre-wrap; }
  .bot { background:#eef2ef; align-self:flex-start; border-bottom-left-radius:4px; }
  .user { background:var(--brand); color:#fff; align-self:flex-end; border-bottom-right-radius:4px; }
  .advisor { background:#e8eaf6; border-left:3px solid #283593; }
  .qr { display:flex; flex-wrap:wrap; gap:6px; align-self:flex-start; }
  .qr button { border:1.5px solid var(--brand); background:#fff; color:var(--brand); border-radius:16px; padding:6px 12px; font-size:13px; cursor:pointer; }
  .qr button:hover, .qr button:focus { background:var(--brand); color:#fff; outline:none; }
  .cards { display:flex; flex-direction:column; gap:7px; width:100%; }
  .card { border-radius:10px; padding:10px 12px; border-left:6px solid; background:var(--card); box-shadow:0 1px 3px rgba(0,0,0,.08); font-size:13px; }
  .card.green { border-color:var(--green); background:var(--green-bg); } .card.amber { border-color:var(--amber); background:var(--amber-bg); }
  .card.red { border-color:var(--red); background:var(--red-bg); }
  .card .top { display:flex; justify-content:space-between; font-weight:600; font-size:14px; }
  .badge { font-size:11px; font-weight:700; padding:2px 7px; border-radius:10px; color:#fff; }
  .badge.green { background:var(--green); } .badge.amber { background:var(--amber); } .badge.red { background:var(--red); }
  .meta { color:var(--muted); margin-top:3px; } .over { font-size:11px; color:var(--red); font-weight:600; }
  .carousel { display:flex; gap:8px; overflow-x:auto; width:100%; padding-bottom:4px; }
  .hotel { min-width:180px; border-radius:10px; background:#fff; border:1px solid #d6e3db; padding:10px; font-size:12.5px; }
  .hotel b { display:block; font-size:13.5px; margin-bottom:3px; } .cert { color:var(--green); font-weight:600; }
  .alert { border:1.5px solid var(--red); background:var(--red-bg); color:var(--red); border-radius:10px; padding:8px 10px; font-size:13px; }
  .src { font-size:11px; color:var(--muted); }
  footer { border-top:1px solid #e1e8e4; padding:10px; display:flex; gap:6px; }
  footer input { flex:1; border:1px solid #c8d4cd; border-radius:20px; padding:9px 14px; font-size:14px; }
  footer button { border:none; background:var(--brand); color:#fff; border-radius:20px; padding:0 14px; cursor:pointer; font-size:14px; }
  footer button.icon { background:#e6efe9; color:var(--brand); }
  .typing { font-size:12px; color:var(--muted); align-self:flex-start; }
  .sr-only { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }
</style>
</head>
<body>
<div id="root"></div>
<script>
const { useState, useRef, useEffect } = React;
const html = htm.bind(React.createElement);
const params = new URLSearchParams(location.search);
const RASA_URL = params.get("rasa") || window.RASA_URL || `${location.protocol}//${location.hostname}:5005`;
const SENDER = "web-" + Math.random().toString(36).slice(2, 10);   // anonymous session id
const BAND_TEXT = { green: "🟢 Low emission", amber: "🟠 Moderate", red: "🔴 High emission" };

/* Send one message to Rasa REST channel; returns array of bot messages. */
async function sendToRasa(message, metadata = {}) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 8000);
  try {
    const r = await fetch(`${RASA_URL}/webhooks/rest/webhook`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ sender: SENDER, message, metadata }), signal: controller.signal });
    if (!r.ok) throw new Error("HTTP " + r.status);
    return await r.json();
  } catch (e) {
    return [{ text: "⚠️ I can't reach the server right now. Please check your connection and try again." }];
  } finally { clearTimeout(timer); }
}

/* Colour-coded transport results card driven by the carbon band from the action server. */
function ResultCards({ items }) {
  return html`<div class="cards" role="list" aria-label="Transport options ranked by score">
    ${items.map((o, i) => html`<div class=${"card " + o.band} role="listitem" key=${i}
        aria-label=${`${o.label}, ${BAND_TEXT[o.band]}, ${o.co2_kg} kilograms CO2e, about ${o.price_eur} euros, ${o.duration_h} hours`}>
      <div class="top"><span>${i === 0 ? "★ " : ""}${o.label}</span><span class=${"badge " + o.band}>${BAND_TEXT[o.band]}</span></div>
      <div class="meta">${o.co2_kg} kg CO₂e/person · €${o.price_eur} · ${o.duration_h} h · ${o.distance_km} km</div>
      <div class="src">Score ${o.score} · carbon: ${o.co2_source} · price: ${o.price_source}</div>
    </div>`)}
  </div>`;
}

function HotelCarousel({ items, source }) {
  return html`<div style=${{ width: "100%" }}>
    <div class="carousel" role="list" aria-label="Eco-certified hotels">
      ${items.map((h, i) => html`<div class="hotel" role="listitem" key=${i}>
        <b>${h.name}</b><span class="cert">✔ ${h.certification}</span>
        <div>€${h.price_per_night}/night · ⭐ ${h.rating}</div>
        <div>${h.co2_per_night_kg} kg CO₂e/night</div>
        <div>${h.accessible ? "♿ Step-free access" : "Limited accessibility"}</div>
      </div>`)}
    </div><div class="src">Source: ${source}</div></div>`;
}

function Offsets({ items, disclaimer }) {
  return html`<div class="cards">${items.map((p, i) => html`<div class="card amber" key=${i}>
      <div class="top"><span>${p.name}</span></div>
      <div class="meta">${p.standard} · ${p.type} · €${p.price_per_tonne_eur}/t</div><div class="src">${p.note}</div></div>`)}
    <div class="src">${disclaimer}</div></div>`;
}

function App() {
  const [msgs, setMsgs] = useState([]);
  const [text, setText] = useState("");
  const [busy, setBusy] = useState(false);
  const [handover, setHandover] = useState(null);
  const handoverRef = useRef(false);
  const logRef = useRef(null);
  useEffect(() => { logRef.current && (logRef.current.scrollTop = logRef.current.scrollHeight); }, [msgs, busy]);
  useEffect(() => { send("/greet", "", true); }, []);

  async function send(payload, display, silent = false, metadata = {}) {
    if (!silent) setMsgs(m => [...m.map(x => ({ ...x, buttons: null })), { from: "user", text: display || payload }]);
    setBusy(true);
    const replies = await sendToRasa(payload, metadata);
    setBusy(false);
    let escalated = handoverRef.current;
    for (const r of replies) {
      if (r.custom && r.custom.type === "handover") { setHandover(r.custom.ticket); handoverRef.current = true; escalated = true; }
    }
    // messages received after escalation are styled as advisor-side; earlier bot messages keep bot style
    setMsgs(m => [...m.map(x => ({ ...x, buttons: null })), ...replies.map(r => ({ from: "bot", advisor: escalated, ...r }))]);
  }

  /* Location button: asks browser permission, sends coordinates only as message metadata. */
  function onButton(b) {
    if (b.payload === "/share_location" && navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        p => send(b.payload, b.title, false, { location: { lat: p.coords.latitude, lon: p.coords.longitude } }),
        () => send(b.payload, b.title));
    } else send(b.payload, b.title);
  }

  /* Optional voice input via the Web Speech API (where supported). */
  function voice() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { alert("Voice input is not supported in this browser."); return; }
    const rec = new SR(); rec.lang = "en-GB";
    rec.onresult = e => send(e.results[0][0].transcript); rec.start();
  }

  function renderMsg(m, i) {
    const out = [];
    if (m.text) out.push(html`<div key=${i + "t"} class=${"msg " + (m.from === "user" ? "user" : "bot" + (m.advisor ? " advisor" : ""))}>${m.text}</div>`);
    const c = m.custom;
    if (c && c.type === "results_cards") out.push(html`<${ResultCards} key=${i + "c"} items=${c.items} />`);
    if (c && c.type === "hotel_carousel") out.push(html`<${HotelCarousel} key=${i + "h"} items=${c.items} source=${c.source} />`);
    if (c && c.type === "offsets") out.push(html`<${Offsets} key=${i + "o"} items=${c.items} disclaimer=${c.disclaimer} />`);
    if (c && c.type === "alert") out.push(html`<div key=${i + "a"} class="alert" role="alert">⚠️ ${c.text}</div>`);
    if (m.buttons && m.buttons.length) out.push(html`<div key=${i + "b"} class="qr" role="group" aria-label="Quick replies">
        ${m.buttons.map((b, j) => html`<button key=${j} onClick=${() => onButton(b)}>${b.title}</button>`)}</div>`);
    return out;
  }

  return html`<div class="app">
    <header><span style=${{ fontSize: "26px" }} aria-hidden="true">🌱</span>
      <div><h1>Eco-Travel Advisor</h1><small>${handover ? "Human advisor" : "Virtual assistant"} · sustainable trip planning</small></div></header>
    ${handover && html`<div class="handover" role="status">👤 Escalated to a human travel advisor · ticket ${handover} · context shared</div>`}
    <div class="log" ref=${logRef} role="log" aria-live="polite" aria-label="Conversation">
      ${msgs.map(renderMsg)}
      ${busy && html`<div class="typing">Advisor is typing…</div>`}
    </div>
    <footer>
      <label for="msg" class="sr-only">Type your message</label>
      <input id="msg" value=${text} placeholder="Type a message…" onInput=${e => setText(e.target.value)}
        onKeyDown=${e => { if (e.key === "Enter" && text.trim()) { send(text.trim()); setText(""); } }} />
      <button class="icon" aria-label="Voice input" onClick=${voice}>🎤</button>
      <button aria-label="Send message" onClick=${() => { if (text.trim()) { send(text.trim()); setText(""); } }}>Send</button>
    </footer>
  </div>`;
}
ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
</script>
</body>
</html>
