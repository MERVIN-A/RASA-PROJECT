version: "3.1"
# =============================================================================
# End-to-end test stories for `rasa test core` (kept separate from training data)
# =============================================================================
stories:
- story: Happy path - city break, high sustainability (button payloads)
  steps:
  - user: |
      hello
    intent: greet
  - action: utter_greet
  - user: |
      I want to plan a trip
    intent: plan_trip
  - action: trip_form
  - active_loop: trip_form
  - user: |
      from [London](origin)
    intent: inform
  - action: trip_form
  - user: |
      /inform{"destination":"Paris"}
    intent: inform
  - action: trip_form
  - user: |
      [next Friday](travel_date)
    intent: inform
  - action: trip_form
  - user: |
      /inform{"budget":"400"}
    intent: inform
  - action: trip_form
  - user: |
      /inform{"sustainability_level":"high"}
    intent: inform
  - action: trip_form
  - active_loop: null
  - action: utter_trip_summary
  - action: action_search_travel
  - action: action_calculate_carbon
  - action: action_rank_options
  - action: utter_anything_else
  - user: |
      show me eco friendly hotels
    intent: find_hotels
  - action: action_show_hotels

- story: Privacy question interrupts the form
  steps:
  - user: |
      help me plan a holiday
    intent: plan_trip
  - action: trip_form
  - active_loop: trip_form
  - user: |
      what do you do with my data
    intent: ask_privacy
  - action: utter_privacy
  - action: trip_form
  - active_loop: trip_form

- story: Explain metric (tooltip) during form
  steps:
  - user: |
      compare transport options
    intent: compare_transport
  - action: trip_form
  - active_loop: trip_form
  - user: |
      what does the colour mean
    intent: explain_metric
  - action: utter_explain_metric
  - action: trip_form
  - active_loop: trip_form

- story: User asks for a human mid-form and consents
  steps:
  - user: |
      I want to plan a trip
    intent: plan_trip
  - action: trip_form
  - active_loop: trip_form
  - user: |
      I want to talk to a human
    intent: request_human
  - action: action_deactivate_loop
  - active_loop: null
  - action: utter_ask_handover_consent
  - user: |
      yes please
    intent: affirm
  - action: action_handover

- story: Handover declined
  steps:
  - user: |
      can I speak to an advisor
    intent: request_human
  - action: utter_ask_handover_consent
  - user: |
      no thanks
    intent: deny
  - action: utter_handover_declined

- story: Offsets after results (business trip)
  steps:
  - user: |
      plan a carbon neutral business trip to [Frankfurt](destination)
    intent: plan_trip
  - action: trip_form
  - active_loop: trip_form
  - user: |
      from [Berlin](origin)
    intent: inform
  - action: trip_form
  - user: |
      [12 June](travel_date)
    intent: inform
  - action: trip_form
  - user: |
      budget of [1000](budget)
    intent: inform
  - action: trip_form
  - user: |
      [medium](sustainability_level)
    intent: inform
  - action: trip_form
  - active_loop: null
  - action: utter_trip_summary
  - action: action_search_travel
  - action: action_calculate_carbon
  - action: action_rank_options
  - action: utter_anything_else
  - user: |
      how can I offset my emissions
    intent: ask_offset
  - action: action_show_offsets

- story: Out of scope then greet
  steps:
  - user: |
      tell me a joke
    intent: out_of_scope
  - action: utter_out_of_scope
  - user: |
      hi
    intent: greet
  - action: utter_greet

- story: GDPR deletion
  steps:
  - user: |
      delete my data
    intent: delete_data
  - action: action_delete_data

- story: Bot challenge and goodbye
  steps:
  - user: |
      are you a bot
    intent: bot_challenge
  - action: utter_iamabot
  - user: |
      bye
    intent: goodbye
  - action: utter_goodbye
